<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hawker Paradise</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e8;--card:#fff;--ink:#2b1d14;--mute:#8a7766;--red:#ff4b3e;--org:#ff9f1c;--grn:#22b573;--pur:#7c5cff;--sh:0 10px 30px -14px rgba(120,60,10,.35)}
@media(prefers-color-scheme:dark){:root{--bg:#1c130e;--card:#2a1d15;--ink:#fff3e3;--mute:#b9a38d;--sh:0 10px 30px -12px #000}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;font-weight:600;background:var(--bg);color:var(--ink);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
svg{display:block}
.w{max-width:560px;margin:auto;padding:16px 16px 110px}
h2{font-size:24px}h3{font-size:16px}
.sub{color:var(--mute);font-size:13px;font-weight:700}
.btn{background:linear-gradient(135deg,var(--red),var(--org));color:#fff;font-weight:800;font-size:17px;padding:14px 28px;border-radius:99px;box-shadow:0 10px 24px -8px var(--red)}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5}
.btn.g{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.full{width:100%;margin-top:10px}
#intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;background:linear-gradient(160deg,#e8362f,#ff9f1c);color:#fff}
#intro h1{font-size:clamp(40px,12vw,64px);line-height:1}
#intro .btn{background:#fff;color:var(--red)}
.bob{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-12px)}}
.xp{background:linear-gradient(135deg,#7c5cff,#b45cff);color:#fff;border-radius:24px;padding:14px 16px;margin:12px 0}
.xp .r{display:flex;justify-content:space-between;align-items:center}
.lv{font-size:28px;font-weight:900}.pill{background:rgba(255,255,255,.22);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:800}
.bar{height:11px;background:rgba(255,255,255,.25);border-radius:99px;margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:#ffe27a;border-radius:99px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:4px;scrollbar-width:none}
.tab{padding:8px 15px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-size:14px;font-weight:800;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:12px}
.row2{display:flex;gap:13px;align-items:center;background:var(--card);padding:13px;border-radius:22px;box-shadow:var(--sh);width:100%;text-align:left}
.row2:active{transform:scale(.98)}
.tile{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none;color:#fff}
.in{flex:1;min-width:0}
.hb{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;margin-left:6px}
.hb.y{background:#d9f7e8;color:#0b7a4b}.hb.n{background:#ffe6cc;color:#a24a00}
.plus{width:38px;height:38px;border-radius:50%;background:var(--grn);color:#fff;display:grid;place-items:center;flex:none}
.lock{opacity:.55}
.tag{background:var(--pur);color:#fff;font-size:11px;padding:2px 7px;border-radius:99px;margin-left:5px}
.hist{background:var(--card);border-radius:18px;padding:13px;margin-bottom:10px;box-shadow:var(--sh)}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));background:var(--card);padding:6px;border-radius:99px;box-shadow:0 14px 40px -10px rgba(0,0,0,.45);display:flex;gap:4px;z-index:20}
#nav button{padding:10px 16px;border-radius:99px;font-weight:800;font-size:14px}
#nav button.on{background:linear-gradient(135deg,var(--red),var(--org));color:#fff}
.sheet{position:fixed;inset:0;background:rgba(20,10,0,.55);display:none;align-items:flex-end;z-index:40}
.sheet.on{display:flex}
.box{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:28px 28px 0 0;padding:20px;max-height:92vh;overflow:auto}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.opt{padding:8px 13px;border-radius:99px;background:var(--card);box-shadow:var(--sh);font-size:14px;font-weight:800;border:2px solid transparent}
.opt.on{border-color:var(--red);color:var(--red)}
textarea{width:100%;border-radius:14px;border:2px solid #f0e2cc;background:var(--card);color:var(--ink);font:inherit;padding:10px;height:64px;resize:none}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-weight:900}
.toys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toy{background:var(--card);border-radius:22px;padding:12px;text-align:center;box-shadow:var(--sh)}
.toy .tile{margin:0 auto 6px;border-radius:50%;width:70px;height:70px}
.toy .b{display:flex;gap:6px;justify-content:center;margin-top:8px}
.toy .b button{padding:7px 12px;border-radius:99px;background:var(--pur);color:#fff;font-size:13px;font-weight:800}
.toy .b .pv{background:none;color:var(--pur);box-shadow:inset 0 0 0 2px var(--pur)}
.toy .b button:disabled{background:#d9cbb8;color:#8a7766}
#stage{position:relative;height:300px;border-radius:22px;background:linear-gradient(180deg,#bfe9ff,#fff6e8 75%);overflow:hidden;touch-action:none;user-select:none}
#stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#e0b979 0 24px,#d4a762 24px 48px)}
#pt{position:absolute;left:0;top:0;width:120px;height:120px;cursor:grab;touch-action:none;z-index:2}
.hint{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:13px;color:#4a6a80;font-weight:800;pointer-events:none}
.spk{position:absolute;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:spk .6s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:800;z-index:99;transition:.4s;max-width:92%;text-align:center}
#toast.on{transform:translate(-50%,0)}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:60;width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center}

#cut{position:fixed;inset:0;overflow:hidden;z-index:10;color:#fff;text-align:center;background:radial-gradient(circle at 15% 10%,#ffd36b,transparent 45%),radial-gradient(circle at 90% 85%,#ff6a4d,transparent 55%),linear-gradient(160deg,#e8362f,#ff9f1c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#cut *{animation-fill-mode:both}
#cut:not(.go) *{animation-play-state:paused!important}
#hero{width:min(320px,76vw);overflow:visible}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:fl 12s ease-in-out infinite}
@keyframes fl{50%{transform:translate(20px,-40px) scale(1.15)}}
.bw{animation:drop 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
.nf{fill:none;stroke:#ffe7a3;stroke-width:5;stroke-linecap:round;animation:nf 1s cubic-bezier(.5,0,.9,.6) calc(1s + var(--d)*.22s)}
@keyframes nf{0%{transform:translateY(-330px);opacity:1}85%{transform:translateY(62px);opacity:1}100%{transform:translateY(62px);opacity:0}}
.nd{fill:none;stroke:#ffe7a3;stroke-width:5;stroke-linecap:round;stroke-dasharray:140;animation:draw 1s ease}
@keyframes draw{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
.eg{transform-box:fill-box;transform-origin:center;animation:pp .5s 4.9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pp{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.st{transform-origin:140px 70px;filter:drop-shadow(0 0 7px #fff);animation:star 1s cubic-bezier(.15,.7,.3,1) 3.9s}
@keyframes star{0%{transform:translate(300px,-260px) rotate(-30deg);opacity:0}15%{opacity:1}100%{transform:none;opacity:1}}
.tr{animation:tr 1.5s 3.9s}
@keyframes tr{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.fl{fill:none;stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring .7s 4.8s ease-out}
@keyframes ring{from{transform:scale(0);opacity:1}to{transform:scale(5);opacity:0}}
.steam{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;animation:steam 2.6s infinite ease-out calc(5s + var(--s))}
@keyframes steam{0%{opacity:0;transform:translateY(14px)}35%{opacity:.8}100%{opacity:0;transform:translateY(-26px)}}
.spark{fill:#fff;transform-box:fill-box;transform-origin:center;animation:tw 2s infinite calc(5s + var(--s))}
@keyframes tw{0%,100%{transform:scale(0)}50%{transform:scale(1)}}
#cut h1{font-family:Fredoka,sans-serif;font-size:clamp(40px,11vw,60px);line-height:1;margin-top:8px;text-shadow:0 4px 0 rgba(0,0,0,.12)}
#cut h1 span{display:inline-block;animation:pop .6s calc(5.2s + var(--i)*.05s) cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.6)}to{opacity:1;transform:none}}
#cut p{font-size:18px;max-width:320px;font-weight:800;margin-top:12px;animation:fade .8s 6.2s}
.go2{margin-top:22px;background:#fff!important;color:var(--red)!important;animation:fade .8s 6.7s;pointer-events:none;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
#cut.rdy .go2{pointer-events:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
#cut.fin *:not(.steam):not(.spark){animation-delay:0s!important;animation-duration:.01s!important}
#cut.fin .steam,#cut.fin .spark{animation-delay:0s!important}
#tap{position:absolute;inset:0;background:radial-gradient(circle at 15% 10%,#ffd36b,transparent 45%),linear-gradient(160deg,#e8362f,#ff9f1c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
#tap .btn{background:#fff;color:var(--red)}
.skip{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;background:rgba(255,255,255,.25);padding:7px 14px;border-radius:99px;font-size:13px;font-weight:800;color:#fff;z-index:6}
.ban{border-radius:24px;padding:16px;color:#fff;margin:8px 0;display:flex;align-items:center;gap:14px;box-shadow:var(--sh)}
.tile span{filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}

h1,h2,h3,.btn,.lv,.tab,#nav button{font-family:Fredoka,Nunito,sans-serif}
h2{text-shadow:0 3px 0 rgba(0,0,0,.12)}
.sub{color:rgba(255,255,255,.92)}
.row2,.hist,.toy,.box,.opt,.qty button,textarea,.btn.g{color:var(--ink)}

.tab{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}

.hb.e{background:#e0e7ff;color:#3730a3}

.gi{position:absolute;top:-50px;animation:gf var(--t) linear forwards;cursor:pointer}

@keyframes sp{to{transform:rotate(360deg)}}
.spin{width:70px;height:70px;border:8px solid #ffe0c2;border-top-color:var(--red);border-right-color:var(--org);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
.pmr{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);padding:12px;border-radius:18px;box-shadow:var(--sh);border:2px solid transparent;margin-top:8px;color:var(--ink)}
.pmr.on{border-color:var(--red)}.pmr .ri{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid #cbb89f;margin-left:auto;flex:none}.pmr.on .rad{border-color:var(--red);background:radial-gradient(var(--red) 45%,transparent 50%)}
.bch{display:flex;align-items:center;gap:7px}.bch i{width:14px;height:14px;border-radius:50%;display:block}
.pcard{border-radius:20px;padding:18px;color:#fff;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);position:relative;overflow:hidden;margin-top:4px}
.pcard:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.paytop{border-radius:22px;padding:16px;color:#fff;background:linear-gradient(135deg,#7c5cff,#b45cff);text-align:center;margin-bottom:6px}
@keyframes dots{0%,20%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.ld span{animation:dots 1.2s infinite}.ld span:nth-child(2){animation-delay:.2s}.ld span:nth-child(3){animation-delay:.4s}
#wheel{transition:transform 4s cubic-bezier(.1,.7,.1,1)}

 for(let k=0;k<cn;k++){const pk=[];let sum=0;const add=x=>{pk.push(x.n);sum+=x.p};

function gRush(){const all=SH.flatMap(s=>s.items.filter(i=>i.t!=='e'&&i.t!=='c'));let sc=0,tl=30,cur;gsheet('Order Rush');
 const dr=()=>{$('#gb').innerHTML=`<div class="line"><b>Score ${sc}</b><b id="rt">${tl}s</b></div><div style="display:grid;place-items:center;background:var(--card);border-radius:22px;padding:14px">${itemImg(cur.a.n,cur.a.t,120)}</div><div style="display:grid;gap:8px;margin-top:10px">${cur.o.map(n=>`<button class="opt" data-g="${n}" style="text-align:center">${n}</button>`).join('')}</div>`};
 const nx=()=>{const a=all[Math.floor(Math.random()*all.length)],o=[a.n];while(o.length<4){const n=all[Math.floor(Math.random()*all.length)].n;if(!o.includes(n))o.push(n)}cur={a,o:o.sort(()=>Math.random()-.5)};dr()};
 nx();$('#gb').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;if(b.dataset.g===cur.a.n){sc++;sfx('coin')}else sfx('error');nx()};
 GT.push(setInterval(()=>{tl--;if(tl<=0){GT.forEach(clearInterval);GT=[];return payout(sc,12)}const e=$('#rt');if(e)e.textContent=tl+'s'},1000))}
function gTow(){const W=280,H=18;let rows=[{x:60,w:160}],cx=0,cw=160,d=1,sp=2.2;gsheet('Tray Tower');
 $('#gb').innerHTML=`<div class="line"><b id="ts">Floors 0</b><span class="sub">Tap to drop the tray</span></div><div id="tw" style="position:relative;width:${W}px;height:320px;margin:auto;background:linear-gradient(#bfe9ff,#fff6e8);border-radius:18px;overflow:hidden"></div><button class="btn full" data-g="1">Drop tray</button>`;
 const draw=()=>{const n=rows.length,off=Math.max(0,n-10);$('#tw').innerHTML=rows.map((r,i)=>`<div style="position:absolute;left:${r.x}px;bottom:${(i-off)*H}px;width:${r.w}px;height:${H-2}px;border-radius:5px;background:hsl(${i*32},75%,60%)"></div>`).join('')+`<div style="position:absolute;left:${cx}px;bottom:${(n-off)*H}px;width:${cw}px;height:${H-2}px;border-radius:5px;background:hsl(${n*32},75%,60%)"></div>`;$('#ts').textContent='Floors '+(n-1)};
 GT.push(setInterval(()=>{cx+=d*sp;if(cx<=0){cx=0;d=1}if(cx+cw>=W){cx=W-cw;d=-1}draw()},16));
 $('#gb').onclick=e=>{if(!e.target.closest('[data-g]'))return;const L=rows[rows.length-1],ov=Math.min(cx+cw,L.x+L.w)-Math.max(cx,L.x);
  if(ov<=2){GT.forEach(clearInterval);GT=[];return payout(rows.length-1,10)}
  rows.push({x:Math.max(cx,L.x),w:ov});cw=ov;sp+=.12;sfx('thud')}}
/* ===== actions ===== */
const inSG=(a,b)=>a>=1.15&&a<=1.48&&b>=103.6&&b<=104.1;
const pass=()=>{sfx('success');S.ok=1;save();V='stalls';render()};
function cut(){}
cut.T=[];
const A={
mem:gMem,pig:gPig,wok:gWok,rush:gRush,tow:gTow,
play:()=>{V='play';render();scrollTo(0,0)},
daily:()=>{const t=today(),y=new Date(Date.now()-864e5).toDateString();if(S.last===t)return;S.streak=S.last===y?(S.streak||0)+1:1;S.last=t;const x=50+20*Math.min(S.streak,7);gain(x);sfx('coin');render();toast('Day '+S.streak+' bonus: +'+x+' XP')},
spin:()=>{if(S.spin===today())return;S.spin=today();save();const pool=[0,0,0,1,1,3,3,5,5,2,7,7,4,6],i=pool[Math.floor(Math.random()*pool.length)];$('#wheel').style.transform=`rotate(${360*6-(i*45+22.5)}deg)`;$('[data-a=spin]').disabled=true;sfx('whoosh');for(let k=0;k<14;k++)setTimeout(()=>sfx('tap'),k*280);setTimeout(()=>{gain(PR[i]);sfx('coin');render();toast('You won '+PR[i]+' XP!')},4300)},
game:()=>{const st=$('#gstage');if(!st||GT.length)return;let sc=0,tl=20;$('[data-a=game]').disabled=true;
 st.innerHTML='<div id="gscore" style="position:absolute;top:8px;left:12px;font-weight:900;color:#2b1d14;z-index:2">Score 0</div><div id="gtime" style="position:absolute;top:8px;right:12px;font-weight:900;color:#2b1d14;z-index:2">20s</div>';
 const K=['bowl','chick','noodle','prata','skewer','sweet','cupm','drink','crab','toast','dumpling'];
 GT.push(setInterval(()=>{const d=document.createElement('div');d.className='gi';d.style.cssText=`left:${Math.random()*80+4}%;--t:${2.2+Math.random()*1.4}s`;d.innerHTML=em(K[Math.floor(Math.random()*K.length)],46);d.onpointerdown=()=>{if(d.x)return;d.x=1;sc++;sfx('coin');$('#gscore').textContent='Score '+sc;d.style.opacity=0;setTimeout(()=>d.remove(),120)};st.appendChild(d);setTimeout(()=>d.remove(),3800)},520));
 GT.push(setInterval(()=>{tl--;const e=$('#gtime');if(e)e.textContent=tl+'s';if(tl<=0){GT.forEach(clearInterval);GT=[];const t=today();if(S.gd!==t){S.gd=t;S.gn=0}let x=0;if(S.gn<5){x=Math.min(sc*4,200);S.gn++}if(x)gain(x);save();sfx('success');render();toast(x?'Score '+sc+'! +'+x+' XP':'Score '+sc+'. Daily XP limit reached')}},1000))},
reset:()=>{sfx('pop');sheet(`<h2>Reset account?</h2><p class="sub" style="margin:10px 0 4px">Are you sure? This permanently deletes your level, XP, toys and order history on this device. You cannot undo this.</p><button class="btn full" data-a="resetyes" style="background:#c62828">Yes, reset everything</button><button class="btn g full" data-a="close">No, keep my progress</button>`)},
resetyes:()=>{S={life:0,wallet:0,orders:[],toys:[],ok:1};cart=[];save();closeSheet();V='stalls';render();scrollTo(0,0);sfx('error');toast('Account reset')},
orderall:()=>{const seen=new Set();let n=0;S.orders.forEach(o=>{if(seen.has(o.shop)||!o.raw)return;seen.add(o.shop);o.raw.forEach(l=>{const m=cart.find(c=>c.s===l.s&&c.n===l.n&&c.desc===l.desc&&c.note===l.note);if(m)m.q+=l.q;else cart.push({...l});n+=l.q})});
 if(!n){sfx('error');return toast('Place a new order first, then you can order it all again')}sfx('pop');drawCart();render()},
begin:()=>{const c=$('#cut');$('#tap').remove();c.classList.add('go');const at=(ms,f)=>cut.T.push(setTimeout(f,ms));
 at(700,()=>sfx('thud'));for(let i=0;i<9;i++)at(1900+i*220,()=>sfx('tap'));at(2900,()=>sfx('pop'));at(3900,()=>sfx('whoosh'));at(4800,()=>sfx('coin'));at(5200,()=>sfx('level'));at(6700,()=>c.classList.add('rdy'))},
skipc:()=>{cut.T.forEach(clearTimeout);const t=$('#tap');t&&t.remove();$('#cut').classList.add('go','fin','rdy')},
start:()=>{(cut.T||[]).forEach(clearTimeout);sfx('success');V=S.ok?'stalls':'loc';render()},
skip:pass,
chk:()=>{const e=$('#err');if(!navigator.geolocation){e.textContent='Location is not supported on this device.';return}
 navigator.geolocation.getCurrentPosition(p=>inSG(p.coords.latitude,p.coords.longitude)?pass():(e.textContent='Sorry, only works in Singapore.',sfx('error')),()=>e.textContent='Please allow location access.',{timeout:12000})},
hf:v=>{hf=v;render()},
shop:v=>{const s=SH[+v];shop=s;tab='menu';V='shop';render();scrollTo(0,0)},
back:()=>{V='stalls';render();scrollTo(0,0)},
tab:v=>{tab=v;render()},ts:v=>{tser=v;render()},
item:v=>{const it=shop.items[+v];if(it.t==='e'&&lvl().l<51){sfx('error');return toast('Reach level 51 to unlock this')}
 sfx('pop');cfg={it,sel:G[it.t].map(g=>g[1]?[0]:[]),q:1,note:''};drawCustom()},
opt:(v,t)=>{const k=+t.dataset.k,g=G[cfg.it.t][k],i=+v;cfg.note=$('#note').value;cfg.sel[k]=g[1]?[i]:cfg.sel[k].includes(i)?cfg.sel[k].filter(x=>x!==i):[...cfg.sel[k],i];drawCustom()},
q:v=>{cfg.note=$('#note').value;cfg.q=Math.max(1,cfg.q+ +v);drawCustom()},
addc:()=>{const it=cfg.it,desc=it.parts?it.parts.join(', '):G[it.t].map((g,k)=>cfg.sel[k].map(i=>g[2][i][0])).flat().join(', ');sfx('add');cart.push({s:shop.n,n:it.n,u:cp(),q:cfg.q,desc,note:$('#note').value.trim()});closeSheet();render();toast(it.n+' added')},
close:closeSheet,
cart:()=>{sfx('pop');drawCart()},
cm:v=>{const l=cart[+v];if(--l.q<=0)cart.splice(+v,1);drawCart();render()},
cpl:v=>{cart[+v].q++;drawCart();render()},
place:()=>{if(!cart.length)return;PM={m:'cash',b:'Visa'};drawPay()},
pm:v=>{PM.m=v;drawPay()},pb:v=>{PM.b=v;drawPay()},
payok:()=>{const c=PM.m==='cash';sheet(`<div style="text-align:center;padding:26px 0 18px"><div class="spin"></div><h2 style="margin-top:20px">${c?'Placing your order':'Processing payment'}<span class="ld"><span>.</span><span>.</span><span>.</span></span></h2><div class="sub" style="margin-top:8px">${c?'Sending it to the stalls':'Paying '+money(totals().tot)+' with '+(PM.m==='qr'?'QR code':PM.b)}</div><div class="sub" style="margin-top:14px">Please do not close this screen</div></div>`);sfx('pop');setTimeout(()=>A.fin(),c?1000:2200)},
fin:()=>{const d=disc(lvl().l),b=lvl().l,by={};cart.forEach(l=>(by[l.s]=by[l.s]||[]).push(l));let xp=0;const num=orderNo(),mn=25+Math.floor(Math.random()*15)+(Object.keys(by).length-1)*5,pay=payTxt(),rc=[],tt=totals().tot;
 Object.entries(by).forEach(([n,ls])=>{rc.push([n,ls]);const tot=ls.reduce((a,l)=>a+l.u*l.q,0)*(1-d/100),x=Math.round(tot*10);xp+=x;S.orders.unshift({shop:n,lines:ls.map(l=>`${l.q}x ${l.n}${l.desc?' ('+l.desc+')':''}`),total:tot,xp:x,raw:ls.map(l=>({...l})),num,pay,mn,date:new Date().toLocaleDateString()})});
 S.life+=xp;S.wallet+=xp;save();cart=[];sfx('bell');render();receipt(num,mn,pay,rc,xp,tt);if(lvl().l>b){setTimeout(()=>{sfx('level');toast('Level up! Level '+lvl().l+': '+disc(lvl().l)+'% off')},1400)}},
pv:v=>openPreview(+v),
buy:v=>askBuy(+v),buyyes:v=>{if(buy(+v)){closeSheet();render()}},
boost:()=>{sfx('coin');S.life+=25000;S.wallet+=25000;save();render();toast('Demo XP added')}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(!t.dataset.a.match(/^(start|skip|chk)$/))sfx('tap');A[t.dataset.a]&&A[t.dataset.a](t.dataset.v,t)});
render();
</script></body></html>
